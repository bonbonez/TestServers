# Test Servers — reverse proxy + static hosting (plain HTTP).
#
# ⚠️ These are DUMMY test servers with dummy creds. This vhost has NO TLS and NO auth. Do
# not expose it to the public internet — put it on an internal network / VPN, prefer the
# TLS variant (set TLS_CERT/TLS_KEY for deploy/install.sh, see docs/DEPLOY.md), and
# firewall the port. The admin console + /api/ let anyone view and edit the (dummy)
# credentials.
#
# deploy/install.sh substitutes @HTTP_PORT@, @SERVER_NAME@ and @LOCATIONS@ (the path of the
# installed test-servers-locations.inc).

server {
    listen @HTTP_PORT@;
    server_name @SERVER_NAME@;

    include @LOCATIONS@;
}
