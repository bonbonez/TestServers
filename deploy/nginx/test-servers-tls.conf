# Test Servers — reverse proxy + static hosting, TLS terminated here.
#
# ⚠️ These are DUMMY test servers with dummy creds. TLS protects the transport, but there is
# still NO auth in front of the admin console or /api/ — keep this on an internal network /
# VPN and firewall the port.
#
# Used instead of test-servers.conf when TLS_CERT/TLS_KEY are given to deploy/install.sh,
# which substitutes @HTTPS_PORT@, @HTTP_PORT@, @SERVER_NAME@, @TLS_CERT@, @TLS_KEY@,
# @REDIRECT_HOST@ and @LOCATIONS@ (the path of the installed test-servers-locations.inc).

server {
    listen @HTTPS_PORT@ ssl;
    server_name @SERVER_NAME@;

    ssl_certificate @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:test_servers_ssl:1m;

    include @LOCATIONS@;
}

# Plain HTTP: send everything to HTTPS.
server {
    listen @HTTP_PORT@;
    server_name @SERVER_NAME@;

    return 301 https://@REDIRECT_HOST@$request_uri;
}
